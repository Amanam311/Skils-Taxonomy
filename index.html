<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nigerian Skills Taxonomy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14261C; --ink-2:#3D5145; --ink-3:#6B7A70;
  --paper:#F0EEE7; --card:#FBFAF6; --rule:#D5D2C8;
  --green:#1F4E2C; --green-d:#0E2617; --moss:#DDE6DA;
  --amber:#9A6407; --amber-bg:#F6EDDC;
  --clay:#8C3A2B; --clay-bg:#F3E3DF;
  --r:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.55 "IBM Plex Sans",system-ui,sans-serif;
  font-feature-settings:"tnum" 0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-ligatures:none}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* ---------- masthead ---------- */
header{background:var(--green-d);color:#E8EDE7;position:sticky;top:0;z-index:40;
  border-bottom:1px solid #000}
.mast{max-width:1240px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:26px;height:58px}
.brand{display:flex;align-items:baseline;gap:10px;flex-shrink:0}
.brand b{font:600 18px/1 "DM Sans",sans-serif;letter-spacing:-.015em}
.brand span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#8FA893}
nav{display:flex;gap:2px;margin-left:auto}
nav a{padding:7px 13px;font-size:13px;color:#A8BCAC;border-radius:var(--r);white-space:nowrap}
nav a:hover{color:#E8EDE7;background:rgba(255,255,255,.07)}
nav a.on{color:var(--green-d);background:#CFE0CF;font-weight:500}

/* ---------- shell ---------- */
main{max-width:1240px;margin:0 auto;padding:26px 22px 90px}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
h1{font:600 33px/1.14 "DM Sans",sans-serif;letter-spacing:-.028em;margin:6px 0 0}
h2{font:600 19px/1.22 "DM Sans",sans-serif;letter-spacing:-.017em;margin:0}
.lede{color:var(--ink-2);max-width:62ch;margin-top:9px;font-size:15.5px}

/* ---------- reach strip : the signature ---------- */
.reach{display:inline-flex;gap:2px;vertical-align:-1px}
.reach i{width:6px;height:13px;background:var(--rule);border-radius:1px;display:block}
.reach i.on{background:var(--green)}
.reach.lg i{width:11px;height:22px}
.reach-key{display:flex;gap:2px;margin-top:7px}
.reach-key div{width:11px;font-size:8.5px;text-align:center;color:var(--ink-3);
  writing-mode:vertical-rl;height:52px;letter-spacing:.02em}

/* ---------- controls ---------- */
.tools{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;margin:22px 0 14px}
.search{position:relative}
.search input{width:100%;padding:11px 13px 11px 34px;border:1px solid var(--rule);
  background:var(--card);border-radius:var(--r);font:inherit;color:inherit}
.search input:focus{border-color:var(--green);outline:none}
.search svg{position:absolute;left:11px;top:12px;width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:2}
.count{font-size:12.5px;color:var(--ink-3);white-space:nowrap;padding-bottom:11px}
.filters{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:18px}
.chip{padding:5px 11px;font-size:12.5px;border:1px solid var(--rule);border-radius:100px;
  background:var(--card);color:var(--ink-2);transition:.12s}
.chip:hover{border-color:var(--ink-3)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:500}
.fgroup{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.fgroup>span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-right:3px}

/* ---------- lists ---------- */
.list{border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:118px 1fr auto;gap:16px;padding:13px 4px;
  border-bottom:1px solid var(--rule);align-items:baseline;width:100%;text-align:left}
.row:hover{background:var(--card)}
.row .id{font-size:11.5px;color:var(--ink-3);letter-spacing:.01em}
.row .nm{font-weight:500;font-size:15px}
.row .sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.row .meta{font-size:11.5px;color:var(--ink-3);text-align:right;white-space:nowrap;display:flex;
  align-items:center;gap:10px;justify-content:flex-end}
.lvl{display:inline-block;min-width:22px;padding:2px 5px;background:var(--moss);color:var(--green-d);
  border-radius:2px;font-size:11px;font-weight:600;text-align:center}
.tag{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:2px;font-weight:600}
.tag.a{background:var(--amber-bg);color:var(--amber)}
.tag.k{background:#E2E6EE;color:#3A4A66}

/* ---------- detail ---------- */
.back{font-size:12.5px;color:var(--ink-3);display:inline-flex;gap:6px;align-items:center;margin-bottom:16px}
.back:hover{color:var(--green)}
.detail{display:grid;grid-template-columns:1fr 296px;gap:38px;align-items:start}
.facts{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:17px 18px;
  position:sticky;top:80px}
.fact{padding:9px 0;border-bottom:1px solid var(--rule)}
.fact:last-child{border:0;padding-bottom:0}
.fact dt{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.fact dd{font-size:14px}
.alts{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.alt{font-size:12.5px;padding:3px 9px;background:var(--moss);border-radius:100px;color:var(--green-d)}
.sect{margin-top:34px}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:8px;
  border-bottom:1.5px solid var(--ink);margin-bottom:2px}
.sect-h span{font-size:12px;color:var(--ink-3)}
.def{font-size:16px;color:var(--ink-2);max-width:60ch;margin-top:12px;line-height:1.5}

/* ---------- home ---------- */
.hero{padding:14px 0 30px;border-bottom:1px solid var(--rule)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;margin:26px 0 0}
.stat{background:var(--card);padding:15px 16px}
.stat b{display:block;font:600 27px/1 "DM Sans",sans-serif;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:5px;display:block}
.secgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:16px}
.seccard{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:15px 16px;
  display:block;transition:.12s}
a.seccard:hover{border-color:var(--green);background:#fff}
.seccard b{font-weight:500;font-size:15px;display:block}
.seccard .n{font:600 22px/1 "DM Sans",sans-serif;letter-spacing:-.022em;color:var(--green);margin-top:9px;display:block}
.seccard .n em{font-style:normal;font-size:11px;color:var(--ink-3);letter-spacing:.09em;
  text-transform:uppercase;margin-left:5px}
.bar{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin-top:11px}
.bar i{display:block;height:100%;background:var(--green)}
.note{background:var(--card);border:1px solid var(--rule);border-left:2.5px solid var(--green);
  border-radius:var(--r);padding:15px 17px;margin-top:16px;font-size:14px;color:var(--ink-2);max-width:70ch}
.note b{color:var(--ink);font-weight:600}

.empty{padding:44px 4px;color:var(--ink-3);font-size:14.5px}
footer{border-top:1px solid var(--rule);margin-top:56px;padding-top:20px;font-size:12.5px;
  color:var(--ink-3);display:flex;gap:22px;flex-wrap:wrap}

@media(max-width:900px){
  .detail{grid-template-columns:1fr}
  .facts{position:static}
  .stats{grid-template-columns:repeat(2,1fr)}
  .secgrid{grid-template-columns:1fr 1fr}
  nav a{padding:7px 9px;font-size:12.5px}
  .brand span{display:none}
}
@media(max-width:620px){
  .row{grid-template-columns:1fr;gap:3px}
  .row .meta{justify-content:flex-start;text-align:left}
  .row .id{order:-1}
  .secgrid{grid-template-columns:1fr}
  .tools{grid-template-columns:1fr}
  h1{font-size:27px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

// sectors a skill reaches
const reachOf={};
Object.keys(bySkill).forEach(si=>{const s=new Set();bySkill[si].forEach(([ri])=>s.add(R[ri].s));reachOf[si]=s});

const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=t=>String(t).toLowerCase();
const reach=(set,lg)=>`<span class="reach${lg?' lg':''}" role="img" aria-label="Required in ${set.size} of 9 sectors">`+
  SECTORS.map(s=>`<i class="${set.has(s)?'on':''}" title="${esc(s)}"></i>`).join('')+`</span>`;

let state={q:'',sec:'',lvl:'',typ:'',grp:'',reuse:''};
const app=document.getElementById('app');

function fmt(n){return n.toLocaleString('en-NG')}

/* ================= OVERVIEW ================= */
function home(){
  const shared=D.skills.filter(s=>(bySkill[s.i]||[]).length>1).length;
  const secCounts={};SECTORS.forEach(s=>secCounts[s]=0);
  D.roles.forEach(r=>secCounts[r.s]++);
  const mx=Math.max(...Object.values(secCounts));
  const top=Object.entries(bySkill).map(([si,a])=>[si,a.length]).sort((a,b)=>b[1]-a[1]).slice(0,6);
  app.innerHTML=`
  <div class="hero">
    <p class="eyebrow">Office of the Vice President · UNDP Nigeria</p>
    <h1>The job roles in Nigeria's economy,<br>and the skills each one needs.</h1>
    <p class="lede">A shared reference layer between employer demand, which is organised around job roles, and training supply, which is organised around skills. Nine sectors, levelled on the National Skills Qualifications Framework.</p>
    <div class="stats">
      <div class="stat"><b>${fmt(D.roles.length)}</b><span>Job roles</span></div>
      <div class="stat"><b>${fmt(D.skills.length)}</b><span>Skills</span></div>
      <div class="stat"><b>${fmt(D.links.length)}</b><span>Role–skill links</span></div>
    </div>
  </div>

  <div class="sect">
    <div class="sect-h"><h2>Browse by sector</h2><span>${fmt(D.roles.length)} roles</span></div>
    <div class="secgrid">${SECTORS.map(s=>`
      <a class="seccard" href="#/roles?sec=${encodeURIComponent(s)}">
        <b>${esc(s)}</b>
        <span class="n">${secCounts[s]}<em>roles</em></span>
        <span class="bar"><i style="width:${Math.round(secCounts[s]/mx*100)}%"></i></span>
      </a>`).join('')}</div>
  </div>

  <div class="sect">
    <div class="sect-h"><h2>The skills that travel furthest</h2><span>sectors reached</span></div>
    <div class="list">${top.map(([si,n])=>{const s=S[si];return `
      <a class="row" href="#/skill/${si}">
        <span class="id mono">${si}</span>
        <span><span class="nm">${esc(s.t)}</span><span class="sub">${esc(s.g)} · ${esc(s.r)}</span></span>
        <span class="meta">${reach(reachOf[si])} <span>${n} roles</span></span>
      </a>`}).join('')}</div>
    <div class="note"><b>${fmt(shared)} of ${fmt(D.skills.length)} skills are required by more than one role.</b>
      A skill is recorded once and referenced by every role that needs it, so the same capability is never
      written twice. The nine-block strip shows which sectors require a skill — that is the taxonomy's
      central idea in one mark.</div>
  </div>

  <div class="sect">
    <div class="sect-h"><h2>How to read it</h2></div>
    <div class="secgrid" style="margin-top:14px">
      <a class="seccard" href="#/roles"><b>Job roles</b>
        <p style="font-size:13.5px;color:var(--ink-2);margin-top:7px">What employers recruit for. Each carries the job titles it is also known by, so employer terminology resolves to the right role.</p></a>
      <a class="seccard" href="#/skills"><b>Skills</b>
        <p style="font-size:13.5px;color:var(--ink-2);margin-top:7px">What a person can do or must know. Written once, shared across every role that requires it, at whatever level that role needs.</p></a>
      <div class="seccard" style="cursor:default"><b>Levels</b>
        <p style="font-size:13.5px;color:var(--ink-2);margin-top:7px">Every requirement is placed on the National Skills Qualifications Framework, Access Level to Level 9, so a role's demands can be read against the qualification system.</p></div>
    </div>
  </div>`;
}

/* ================= ROLES ================= */
function rolesView(){
  const lv=[...new Set(D.roles.map(r=>r.l))].sort((a,b)=>a-b);
  app.innerHTML=`
    <p class="eyebrow">Pillar one</p><h1>Job roles</h1>
    <p class="lede">What employers recruit for. Search the preferred title or any of the ${fmt(D.roles.reduce((a,r)=>a+r.a.length,0))} alternative titles recorded — trade names and local-language terms included.</p>
    <div class="tools">
      <label class="search"><span class="sr" style="position:absolute;left:-9999px">Search roles</span>
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" placeholder="Search roles, alternative titles or clusters" value="${esc(state.q)}"></label>
      <span class="count" id="ct"></span>
    </div>
    <div class="filters">
      <div class="fgroup"><span>Sector</span>
        <button class="chip${state.sec?'':' on'}" data-f="sec" data-v="">All</button>
        ${SECTORS.map(s=>`<button class="chip${state.sec===s?' on':''}" data-f="sec" data-v="${esc(s)}">${esc(SHORT[s])}</button>`).join('')}</div>
    </div>
    <div class="filters">
      <div class="fgroup"><span>Level</span>
        <button class="chip${state.lvl?'':' on'}" data-f="lvl" data-v="">All</button>
        ${lv.map(l=>`<button class="chip${state.lvl==l?' on':''}" data-f="lvl" data-v="${l}">${l}</button>`).join('')}</div>
      <div class="fgroup" style="margin-left:14px"><span>Type</span>
        <button class="chip${state.typ?'':' on'}" data-f="typ" data-v="">All</button>
        <button class="chip${state.typ==='Professional'?' on':''}" data-f="typ" data-v="Professional">Professional</button>
        <button class="chip${state.typ==='Vocational'?' on':''}" data-f="typ" data-v="Vocational">Vocational</button></div>
    </div>
    <div class="list" id="out"></div>`;
  wire(drawRoles); drawRoles();
}
function drawRoles(){
  const qq=norm(state.q);
  const res=D.roles.filter(r=>{
    if(state.sec&&r.s!==state.sec)return false;
    if(state.lvl&&r.l!=state.lvl)return false;
    if(state.typ&&r.y!==state.typ)return false;
    if(!qq)return true;
    return norm(r.t).includes(qq)||r.i.toLowerCase().includes(qq)||
      r.a.some(a=>norm(a).includes(qq))||norm(r.c).includes(qq);
  });
  document.getElementById('ct').textContent=`${fmt(res.length)} of ${fmt(D.roles.length)} roles`;
  const out=document.getElementById('out');
  if(!res.length){out.innerHTML=`<p class="empty">No roles match that search. Try a shorter term, or clear the filters.</p>`;return}
  out.innerHTML=res.slice(0,400).map(r=>{
    const n=(byRole[r.i]||[]).length;
    const hint=qq&&!norm(r.t).includes(qq)?matchAlt(r,qq):'';
    return `<a class="row" href="#/role/${r.i}">
      <span class="id mono">${r.i}</span>
      <span><span class="nm">${esc(r.t)}</span>
        <span class="sub">${esc(SHORT[r.s])} · ${esc(r.c)}${hint}</span></span>
      <span class="meta"><span class="lvl">L${r.l}</span><span>${n} skills</span></span></a>`}).join('')
    +(res.length>400?`<p class="empty">Showing the first 400. Narrow the search to see the rest.</p>`:'');
}
function matchAlt(r,qq){const m=r.a.find(a=>norm(a).includes(qq));
  if(m)return ` · also known as <b style="font-weight:600;color:var(--green)">${esc(m)}</b>`;
  const c=norm(r.c).includes(qq)?r.c:'';
  return c?` · matched on <b style="font-weight:600;color:var(--green)">${esc(c)}</b>`:''}

/* ================= SKILLS ================= */
function skillsView(){
  const groups=[...new Set(D.skills.map(s=>s.g))].sort();
  app.innerHTML=`
    <p class="eyebrow">Pillar two</p><h1>Skills</h1>
    <p class="lede">What a person can do or must know. Each skill is recorded once and referenced by every role that requires it, at whatever level that role needs.</p>
    <div class="tools">
      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" placeholder="Search skills and definitions" value="${esc(state.q)}"></label>
      <span class="count" id="ct"></span>
    </div>
    <div class="filters">
      <div class="fgroup"><span>Reach</span>
        <button class="chip${state.reuse?'':' on'}" data-f="reuse" data-v="">All</button>
        ${['cross-sector','sector-specific','occupation-specific'].map(v=>
          `<button class="chip${state.reuse===v?' on':''}" data-f="reuse" data-v="${v}">${v}</button>`).join('')}</div>
      <div class="fgroup" style="margin-left:14px"><span>Type</span>
        <button class="chip${state.typ?'':' on'}" data-f="typ" data-v="">All</button>
        <button class="chip${state.typ==='skill'?' on':''}" data-f="typ" data-v="skill">skill</button>
        <button class="chip${state.typ==='knowledge'?' on':''}" data-f="typ" data-v="knowledge">knowledge</button></div>
    </div>
    <div class="filters"><div class="fgroup"><span>Group</span>
      <select id="grp" style="padding:6px 9px;border:1px solid var(--rule);border-radius:var(--r);background:var(--card);font:inherit;font-size:13px;max-width:340px">
        <option value="">All ${groups.length} skill groups</option>
        ${groups.map(g=>`<option value="${esc(g)}"${state.grp===g?' selected':''}>${esc(g)}</option>`).join('')}
      </select></div></div>
    <div class="list" id="out"></div>`;
  wire(drawSkills);
  document.getElementById('grp').onchange=e=>{state.grp=e.target.value;drawSkills()};
  drawSkills();
}
function drawSkills(){
  const qq=norm(state.q);
  const res=D.skills.filter(s=>{
    if(state.reuse&&s.r!==state.reuse)return false;
    if(state.typ&&s.y!==state.typ)return false;
    if(state.grp&&s.g!==state.grp)return false;
    if(!qq)return true;
    return norm(s.t).includes(qq)||norm(s.d).includes(qq)||s.i.toLowerCase().includes(qq)||norm(s.g).includes(qq);
  });
  document.getElementById('ct').textContent=`${fmt(res.length)} of ${fmt(D.skills.length)} skills`;
  const out=document.getElementById('out');
  if(!res.length){out.innerHTML=`<p class="empty">No skills match that search. Try a shorter term, or clear the filters.</p>`;return}
  out.innerHTML=res.slice(0,400).map(s=>{
    const n=(bySkill[s.i]||[]).length;
    return `<a class="row" href="#/skill/${s.i}">
      <span class="id mono">${s.i}</span>
      <span><span class="nm">${esc(s.t)}</span><span class="sub">${esc(s.g)}${s.y==='knowledge'?' · <span class="tag k">knowledge</span>':''}${s.n?' · <span class="tag a">authored</span>':''}</span></span>
      <span class="meta">${reach(reachOf[s.i]||new Set())}<span>${n} role${n==1?'':'s'}</span></span></a>`}).join('')
    +(res.length>400?`<p class="empty">Showing the first 400. Narrow the search to see the rest.</p>`:'');
}

/* ================= ROLE DETAIL ================= */
function roleView(id){
  const r=R[id]; if(!r)return notFound();
  const sk=(byRole[id]||[]).map(([si,lv,es])=>({s:S[si],lv,es}))
    .sort((a,b)=>b.es-a.es||b.lv-a.lv||a.s.t.localeCompare(b.s.t));
  const ess=sk.filter(x=>x.es).length;
  app.innerHTML=`
    <a class="back" href="#/roles">← All job roles</a>
    <div class="detail">
      <div>
        <p class="eyebrow">${esc(r.s)} · ${esc(r.c)}</p>
        <h1>${esc(r.t)}</h1>
        ${r.a.length?`<div class="alts">${r.a.map(a=>`<span class="alt">${esc(a)}</span>`).join('')}</div>`:''}
        <div class="sect">
          <div class="sect-h"><h2>Skills required</h2><span>${ess} essential of ${sk.length}</span></div>
          <div class="list">${sk.map(x=>`
            <a class="row" href="#/skill/${x.s.i}">
              <span class="id mono">${x.s.i}</span>
              <span><span class="nm">${esc(x.s.t)}</span><span class="sub">${esc(x.s.g)} · ${esc(x.s.r)}</span></span>
              <span class="meta">${x.es?'<b style="color:var(--green);font-weight:600">essential</b>':'<span>optional</span>'}
                <span class="lvl">L${x.lv}</span></span></a>`).join('')}</div>
        </div>
      </div>
      <dl class="facts">
        <div class="fact"><dt>Role ID</dt><dd class="mono">${esc(r.i)}</dd></div>
        <div class="fact"><dt>NSQ level</dt><dd>${esc(D.levels[r.l]?D.levels[r.l].n:'Level '+r.l)}</dd>
          <dd style="font-size:12.5px;color:var(--ink-3);margin-top:3px">${esc(D.levels[r.l]?D.levels[r.l].e:'')}</dd></div>
        <div class="fact"><dt>Type</dt><dd>${esc(r.y)}</dd></div>
        <div class="fact"><dt>Sector</dt><dd>${esc(r.s)}</dd></div>
        <div class="fact"><dt>Cluster</dt><dd>${esc(r.c)}</dd></div>
      </dl>
    </div>`;
}

/* ================= SKILL DETAIL ================= */
function skillView(id){
  const s=S[id]; if(!s)return notFound();
  const rs=(bySkill[id]||[]).map(([ri,lv,es])=>({r:R[ri],lv,es}));
  const bySec={};rs.forEach(x=>(bySec[x.r.s]=bySec[x.r.s]||[]).push(x));
  const ess=rs.filter(x=>x.es).length;
  const lvls=[...new Set(rs.map(x=>x.lv))].sort((a,b)=>a-b);
  const set=reachOf[id]||new Set();
  app.innerHTML=`
    <a class="back" href="#/skills">← All skills</a>
    <div class="detail">
      <div>
        <p class="eyebrow">${esc(s.g)}</p>
        <h1>${esc(s.t)}</h1>
        <p class="def">${esc(s.d)}</p>
        <div class="sect">
          <div class="sect-h"><h2>Roles requiring this skill</h2><span>${ess} essential of ${rs.length}</span></div>
          ${SECTORS.filter(x=>bySec[x]).map(sec=>`
            <p class="eyebrow" style="margin:20px 0 6px">${esc(sec)} · ${bySec[sec].length}</p>
            <div class="list">${bySec[sec]
              .sort((a,b)=>b.es-a.es||b.lv-a.lv||a.r.t.localeCompare(b.r.t)).map(x=>`
              <a class="row" href="#/role/${x.r.i}">
                <span class="id mono">${x.r.i}</span>
                <span><span class="nm">${esc(x.r.t)}</span><span class="sub">${esc(x.r.c)}</span></span>
                <span class="meta">${x.es?'<b style="color:var(--green);font-weight:600">essential</b>':'<span>optional</span>'}
                  <span class="lvl">L${x.lv}</span></span></a>`).join('')}</div>`).join('')}
        </div>
      </div>
      <dl class="facts">
        <div class="fact"><dt>Skill ID</dt><dd class="mono">${esc(s.i)}</dd></div>
        <div class="fact"><dt>Sector reach</dt><dd>${reach(set,true)}
          <div class="reach-key">${SECTORS.map(x=>`<div>${esc(SHORT[x])}</div>`).join('')}</div>
          <div style="font-size:12.5px;color:var(--ink-3);margin-top:7px">Required in ${set.size} of 9 sectors</div></dd></div>
        <div class="fact"><dt>Type</dt><dd>${esc(s.y)}${s.y==='knowledge'?' — examined, not demonstrated':' — demonstrated in practice'}</dd></div>
        <div class="fact"><dt>Reuse level</dt><dd>${esc(s.r)}</dd></div>
        <div class="fact"><dt>Levels demanded</dt><dd>${lvls.map(l=>`<span class="lvl">L${l}</span>`).join(' ')}</dd></div>
        <div class="fact"><dt>Skill group</dt><dd>${esc(s.g)}</dd></div>
        <div class="fact"><dt>Introduced by</dt><dd>${esc(s.b)}</dd>
          <dd style="font-size:12.5px;color:var(--ink-3);margin-top:3px">Provenance, not ownership — any sector may require it.</dd></div>
        ${s.n?`<div class="fact"><dt>Provenance</dt><dd><span class="tag a">authored</span></dd>
          <dd style="font-size:12.5px;color:var(--ink-3);margin-top:5px">Written during construction to record a capability the sector evidence does not surface as a distinct item.</dd></div>`:''}
      </dl>
    </div>`;
}

function notFound(){app.innerHTML=`<h1>Not found</h1><p class="lede">That record does not exist in the taxonomy. Start from <a href="#/roles" style="color:var(--green);text-decoration:underline">job roles</a> or <a href="#/skills" style="color:var(--green);text-decoration:underline">skills</a>.</p>`}

function wire(fn){
  const inp=document.getElementById('q');
  if(inp)inp.oninput=e=>{state.q=e.target.value;fn()};
  document.querySelectorAll('.chip[data-f]').forEach(b=>b.onclick=()=>{
    state[b.dataset.f]=b.dataset.v;
    b.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));
    fn();
  });
}

function route(){
  const h=location.hash.replace(/^#\/?/,'');
  const [path,qs]=h.split('?');
  const seg=path.split('/').filter(Boolean);
  const params=new URLSearchParams(qs||'');
  if(seg[0]!=='role'&&seg[0]!=='skill')state={q:'',sec:params.get('sec')||'',lvl:'',typ:'',grp:'',reuse:''};
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.nav===(seg[0]||'')));
  window.scrollTo(0,0);
  if(!seg.length)return home();
  if(seg[0]==='roles')return rolesView();
  if(seg[0]==='skills')return skillsView();
  if(seg[0]==='role')return roleView(seg[1]);
  if(seg[0]==='skill')return skillView(seg[1]);
  notFound();
}
addEventListener('hashchange',route);
route();
</script>
<footer style="max-width:1240px;margin:0 auto;padding:20px 22px 40px">
  <span>Nigerian Skills Taxonomy v1.0</span>
  <span>Prepared by Hawksworth Advisors for the Office of the Vice President and UNDP Nigeria</span>
  <span>Levelled on the National Skills Qualifications Framework</span>
</footer>
</body>
</html>
